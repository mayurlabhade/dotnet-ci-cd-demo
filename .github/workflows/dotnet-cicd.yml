name: .NET CI/CD Pipeline

on:
  workflow_dispatch: # Enables the manual "Run workflow" button
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{vars.DOTNET_VERSION}}

      - name: dotnet restore
        run: dotnet restore src/MyApi/MyApi.csproj

      - name: dotnet build
        run: dotnet build src/MyApi/MyApi.csproj --configuration Release --no-restore

      - name: dotenet test
        run: dotnet test tests/MyApi.Tests/MyApi.Tests.csproj --configuration Release --verbosity normal
